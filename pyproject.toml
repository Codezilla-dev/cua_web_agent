[project]
name = "cua"
version = "0.1.0"
description = "Computer-use capability system: an LLM drives a live UI to complete a goal; the run is recorded as evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omer Adnan" }]

# Phase 1 runtime dependencies. Each one is justified; nothing speculative.
dependencies = [
    "playwright>=1.48",       # the only browser automation library; used only in src/surface/web.py
    "pydantic>=2.9",          # every model that crosses a stage boundary (src/types.py)
    "pydantic-settings>=2.5", # typed config loading (src/config.py)
    "pyyaml>=6.0",            # config/default.yaml
    "httpx>=0.27",            # OpenRouter chat-completions calls (src/agent/planner.py)
    # target_app/ only: the local legacy-hostile app the agent drives. Not imported by src/.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9", # FastAPI form posts
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.386",
    "pytest>=8.3",
]

[project.scripts]
cua = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "target_app"]

[tool.ruff.lint.isort]
known-first-party = ["src", "target_app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "target_app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
